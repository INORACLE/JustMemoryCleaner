name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memorycleaner-1.20.1
          path: build/libs/
          if-no-files-found: error

  build-neoforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NeoForge branch
        uses: actions/checkout@v4
        with:
          ref: neoforge-1.21.1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod (NeoForge)
        run: ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memorycleaner-neoforge-1.21.1
          path: build/libs/
          if-no-files-found: error

  build-fabric-1.21.1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fabric 1.21.1 branch
        uses: actions/checkout@v4
        with:
          ref: fabric-1.21.1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod (Fabric 1.21.1)
        run: ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memorycleaner-fabric-1.21.1
          path: build/libs/
          if-no-files-found: error